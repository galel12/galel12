<svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195" role="img" aria-label="Languages I work in">
  <style>
    .title { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e4e4e7; }
    .label { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #e4e4e7; }
    .muted { font: 400 10px 'Segoe UI', Ubuntu, Sans-Serif; fill: #a1a1aa; }
  </style>
  <rect width="300" height="195" rx="4.5" fill="#18181b"/>
  <text x="20" y="32" class="title">Languages I work in</text>
  <text x="20" y="48" class="muted">weighted by Flight Control + side repos</text>

  <!-- Go 62% -->
  <text x="20" y="78" class="label">Go</text>
  <text x="260" y="78" class="label" text-anchor="end">62%</text>
  <rect x="20" y="84" width="260" height="8" rx="4" fill="#27272a"/>
  <rect x="20" y="84" width="161" height="8" rx="4" fill="#00ADD8"/>

  <!-- TypeScript 14% -->
  <text x="20" y="112" class="label">TypeScript</text>
  <text x="260" y="112" class="label" text-anchor="end">14%</text>
  <rect x="20" y="118" width="260" height="8" rx="4" fill="#27272a"/>
  <rect x="20" y="118" width="36" height="8" rx="4" fill="#3178C6"/>

  <!-- Python 10% -->
  <text x="20" y="146" class="label">Python</text>
  <text x="260" y="146" class="label" text-anchor="end">10%</text>
  <rect x="20" y="152" width="260" height="8" rx="4" fill="#27272a"/>
  <rect x="20" y="152" width="26" height="8" rx="4" fill="#3572A5"/>

  <!-- Rust / Shell -->
  <text x="20" y="180" class="label">Rust · Shell · C</text>
  <text x="260" y="180" class="label" text-anchor="end">14%</text>
</svg>
